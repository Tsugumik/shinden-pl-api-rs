[package]
name = "shinden-pl-api"
version = "0.1.6"
authors = ["Błażej Drozd"]
edition = "2024"

description = "A blazingly fast API client for Shinden.pl, written in Rust."
license = "MIT"
repository = "https://github.com/Tsugumik/shinden-pl-api-rs"
keywords = ["shinden", "api", "scraper", "anime", "rust"]
readme = "README.md"

[dependencies]
cookie_store = { version = "0.22.0", features = ["serde", "serde_json"] }
dirs = "6.0.0"
reqwest = { version = "0.12.25", features = ["brotli", "deflate", "gzip"] }
reqwest_cookie_store = { version = "0.9.0", features = ["serde"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.48.0"
thiserror = "2.0.17"